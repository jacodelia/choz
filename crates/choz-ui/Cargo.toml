[package]
name = "choz-ui"
version.workspace = true
edition.workspace = true
description.workspace = true
license = "MIT"

[[bin]]
name = "choz"
path = "src/main.rs"

# ─── Packaging ──────────────────────────────────────────────────────────────
#
# `cargo deb -p choz-ui` and `cargo generate-rpm -p crates/choz-ui` (after a
# release build). Both replace an older version of the same package by name, so
# the "detect and uninstall the previous one" half of installing is the package
# manager's job — `packaging/install.sh` is for people not using either.
#
# Nothing here owns ~/.local/state/choz: the projects, plugin paths and settings
# are the user's and survive every uninstall.

[package.metadata.deb]
name = "choz"
maintainer = "Jorge Codelia <jorgecodelia@gmail.com>"
section = "sound"
priority = "optional"
# `$auto` reads the binary: ALSA and glibc come out of it, and **that is what
# makes the package refuse to install without them** — apt reports the unmet
# dependency and installs nothing (verified against a package with a dependency
# that cannot be satisfied).
#
# libjack is *not* there on purpose: choz `dlopen`s it, so without it choz runs
# on ALSA. That makes it a recommendation, which apt installs by default and the
# user can decline.
depends = "$auto"
recommends = "libjack-jackd2-0 | libjack0, puredata"
# Refresh the menu, MIME and icon caches. Debian ships triggers that usually do
# this; "usually" is how an application installs and never appears in the menu.
maintainer-scripts = "../../packaging/debian"
extended-description = """\
choz hosts CLAP, LV2, LADSPA, DSSI, VST2 and VST3 plugins from a terminal: a \
multi-slot rack with a mixer, insert FX, MIDI/OSC routing and YAML projects. \
Plugins that misbehave are scanned, probed and hosted out of process."""

# `target/release/choz`, not `../../target/release/choz`: the first form is the
# only one cargo-deb recognises as the Cargo target directory, and recognising it
# is what makes it rewrite the path under `--target`. With the `../..` form it
# packaged the **host** binary into an arm64 package. Everything else is relative
# to this manifest, as cargo-deb expects; only the binary is special.
#
# These belong here and **not** in the `arm` variant below, where they spent a
# release: a variant inherits from this table, not the other way round, so the
# ordinary x86_64 package carried the binary and nothing else — no desktop entry,
# no icon, no launcher, which is exactly why choz never appeared in the menu.
# Nothing warns about it. `dpkg-deb -c` is the only way to see what is in there.
assets = [
    ["target/release/choz", "usr/bin/", "755"],
    ["../../packaging/desktop/choz-launcher", "usr/bin/", "755"],
    ["../../packaging/desktop/choz.desktop", "usr/share/applications/", "644"],
    ["../../packaging/desktop/choz.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    # **The PNGs are not a nicety, they are the icon.** GTK 3 loads theme icons
    # through gdk-pixbuf, and librsvg 2.61 dropped the gdk-pixbuf SVG loader — so
    # on a current system a scalable-only icon does not render at all and the
    # menu draws its generic cog instead. Seen on XFCE with the file installed,
    # readable and correctly named; `Gtk.IconTheme` even resolved it. It was
    # `GdkPixbuf.new_from_file_at_size` that said "couldn't recognize the image
    # file format". The `.svg` stays for GTK 4 and Qt, which rasterise it
    # themselves.
    ["../../packaging/desktop/icons/16x16/choz.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["../../packaging/desktop/icons/24x24/choz.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["../../packaging/desktop/icons/32x32/choz.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["../../packaging/desktop/icons/48x48/choz.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["../../packaging/desktop/icons/64x64/choz.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["../../packaging/desktop/icons/128x128/choz.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../packaging/desktop/icons/256x256/choz.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../packaging/desktop/choz-project.xml", "usr/share/mime/packages/", "644"],
    ["../../README.md", "usr/share/doc/choz/README.md", "644"],
    # The wallpapers ship with the program: a fresh install opens on the image
    # choz was built with rather than on a bare terminal, and the picker starts
    # in this directory. See `settings::wallpaper_dir`.
    ["../../assets/*.jpg", "usr/share/choz/wallpapers/", "644"],
    ["../../assets/*.png", "usr/share/choz/wallpapers/", "644"],
    # choz's own 45 effects, as a CLAP plugin for any other host. Installed
    # system-wide, which is a directory every CLAP host already searches.
    ["target/release/libchoz_plugin_clap_export.so", "usr/lib/clap/choz.clap", "644"],
    # The only binary that links libpd, and the one the engine looks for beside
    # choz itself when a tab runs a Pure Data patch.
    ["target/release/choz-pd-host", "usr/bin/", "755"],
]

# Cross-compiled packages, where `$auto` cannot help: reading an ARM binary's
# needed libraries means asking the *host* dpkg about them, and it has none.
# Without this the ARM package declares no dependencies at all — it installs on
# a Pi with no ALSA and then opens no audio device, which is the exact failure
# `$auto` protects the x86_64 package from.
#
#   cargo deb -p choz-ui --variant arm --target aarch64-unknown-linux-gnu
[package.metadata.deb.variants.arm]
depends = "libasound2t64 | libasound2, libc6"

[package.metadata.generate-rpm]
name = "choz"
summary = "A terminal audio plugin host"
# Same reason as the .deb's maintainer scripts: without this the desktop entry
# is installed and never indexed.
post_install_script = """
update-desktop-database -q /usr/share/applications 2>/dev/null || true
update-mime-database /usr/share/mime 2>/dev/null || true
gtk-update-icon-cache -q -f -t /usr/share/icons/hicolor 2>/dev/null || true
"""
post_uninstall_script = """
update-desktop-database -q /usr/share/applications 2>/dev/null || true
update-mime-database /usr/share/mime 2>/dev/null || true
gtk-update-icon-cache -q -f -t /usr/share/icons/hicolor 2>/dev/null || true
"""
# rpm reads the ELF itself: the built package requires `libasound.so.2()(64bit)`
# (down to its ALSA_0.9 symbol versions), libc, libm, libgcc_s and the loader, so
# `dnf`/`rpm -i` fails with "Failed dependencies" on a box without ALSA.
# JACK is dlopened, hence weak.
assets = [
    { source = "../../target/release/choz", dest = "/usr/bin/choz", mode = "755" },
    { source = "../../packaging/desktop/choz-launcher", dest = "/usr/bin/choz-launcher", mode = "755" },
    { source = "../../packaging/desktop/choz.desktop", dest = "/usr/share/applications/choz.desktop", mode = "644" },
    { source = "../../packaging/desktop/choz.svg", dest = "/usr/share/icons/hicolor/scalable/apps/choz.svg", mode = "644" },
    # See the .deb's list: without the PNGs, GTK 3 draws a generic cog.
    { source = "../../packaging/desktop/icons/16x16/choz.png", dest = "/usr/share/icons/hicolor/16x16/apps/choz.png", mode = "644" },
    { source = "../../packaging/desktop/icons/24x24/choz.png", dest = "/usr/share/icons/hicolor/24x24/apps/choz.png", mode = "644" },
    { source = "../../packaging/desktop/icons/32x32/choz.png", dest = "/usr/share/icons/hicolor/32x32/apps/choz.png", mode = "644" },
    { source = "../../packaging/desktop/icons/48x48/choz.png", dest = "/usr/share/icons/hicolor/48x48/apps/choz.png", mode = "644" },
    { source = "../../packaging/desktop/icons/64x64/choz.png", dest = "/usr/share/icons/hicolor/64x64/apps/choz.png", mode = "644" },
    { source = "../../packaging/desktop/icons/128x128/choz.png", dest = "/usr/share/icons/hicolor/128x128/apps/choz.png", mode = "644" },
    { source = "../../packaging/desktop/icons/256x256/choz.png", dest = "/usr/share/icons/hicolor/256x256/apps/choz.png", mode = "644" },
    { source = "../../packaging/desktop/choz-project.xml", dest = "/usr/share/mime/packages/choz-project.xml", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/choz/README.md", mode = "644", doc = true },
    # Same three as the .deb: the wallpapers a fresh install opens with, choz's
    # own effects as a CLAP plugin, and the Pure Data child.
    { source = "../../assets/*.jpg", dest = "/usr/share/choz/wallpapers/", mode = "644" },
    { source = "../../assets/*.png", dest = "/usr/share/choz/wallpapers/", mode = "644" },
    { source = "../../target/release/libchoz_plugin_clap_export.so", dest = "/usr/lib/clap/choz.clap", mode = "644" },
    { source = "../../target/release/choz-pd-host", dest = "/usr/bin/choz-pd-host", mode = "755" },
]

[dependencies]
choz-engine.workspace = true
choz-ports.workspace = true
anyhow.workspace = true
ratatui.workspace = true
crossterm.workspace = true
serde.workspace = true
serde_json.workspace = true
flume.workspace = true
midir.workspace = true
libc = "0.2"
ratatui-image = "8"
# Already in the tree via ratatui-image; used directly for the kitty wallpaper.
base64-simd = "0.8"
# Background wallpapers. Only the formats the file browser offers.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
serde_yaml = "0.9"

# Plugin editors are X11 child windows; only Linux builds get one.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

# A weak dependency, and a table because that is the shape cargo-generate-rpm
# takes: libjack is `dlopen`ed, so choz runs without it — on ALSA.
[package.metadata.generate-rpm.recommends]
jack-audio-connection-kit = "*"
