[package]
name = "choz-plugin-clap"
version.workspace = true
edition.workspace = true
description = "CLAP plugin hosting for choz (real hosting via clack-host behind the 'clap' feature)."

[features]
default = []
# Real CLAP hosting (discovery + instrument audio) via the safe clack-host crate.
clap = ["dep:clack-host", "dep:clack-extensions"]

[dependencies]
choz-ports.workspace = true
anyhow.workspace = true
serde.workspace = true
clack-host = { version = "0.1.0", optional = true }
# audio-ports: needed to match a plugin's real channel counts (mono plugins
# reject a hardcoded stereo layout).
clack-extensions = { version = "0.1.0", features = ["audio-ports", "params", "clack-host"], optional = true }
