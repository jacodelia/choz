<?xml version="1.0" encoding="UTF-8"?>
<!-- choz: a synth — a waveform over a keyboard.

     Drawn here rather than taken from an icon set, so there is no licence to
     track: it is MIT with the rest of the project.

     Everything is flat and nothing is thinner than 2px at 64, because the size
     that matters is 16: at that scale a gradient is mud and a hairline is gone.
     What has to survive is the silhouette — keys along the bottom, a wave
     across the top — which reads as "sound" before anything is legible. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Body -->
  <rect x="3" y="8" width="58" height="48" rx="7" fill="#161b22"/>
  <rect x="3" y="8" width="58" height="48" rx="7" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- The wave. One stroke, wide enough to hold together when the whole icon
       is 16px across. -->
  <path d="M9 27 L15 27 L18 18 L23 36 L27 22 L31 31 L35 27 L55 27"
        fill="none" stroke="#f0883e" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Keyboard. A real octave is seven whites and five blacks; at 16px those
       twelve keys are 1px apart and turn into grey mush — rendered and looked
       at, not assumed. So: no white-key dividers (the blacks imply them) and
       three fat blacks instead of five. Wrong as a piano, right as a 16px
       silhouette, and 16px is where this icon lives. -->
  <rect x="9" y="40" width="46" height="13" rx="2" fill="#e6edf3"/>
  <g fill="#0d1117">
    <rect x="16" y="40" width="6" height="8" rx="1"/>
    <rect x="29" y="40" width="6" height="8" rx="1"/>
    <rect x="42" y="40" width="6" height="8" rx="1"/>
  </g>
</svg>
