<?xml version="1.0" encoding="UTF-8"?>
<!-- choz: a terminal window with a rack of knobs in it. Flat colours only, so
     it stays legible at 16px in a menu. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect x="2" y="6" width="60" height="52" rx="6" fill="#161b22"/>
  <rect x="2" y="6" width="60" height="10" rx="6" fill="#0d1117"/>
  <rect x="2" y="12" width="60" height="4" fill="#0d1117"/>
  <circle cx="9" cy="11" r="2" fill="#f0883e"/>
  <circle cx="16" cy="11" r="2" fill="#3a4048"/>
  <circle cx="23" cy="11" r="2" fill="#3a4048"/>

  <!-- three knobs, the arc choz draws for a continuous parameter -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M11 40 A8 8 0 1 1 25 40" stroke="#30363d"/>
    <path d="M11 40 A8 8 0 0 1 14 30" stroke="#1f6feb"/>
    <path d="M25 40 A8 8 0 1 1 39 40" stroke="#30363d"/>
    <path d="M25 40 A8 8 0 0 1 32 26" stroke="#1f6feb"/>
    <path d="M39 40 A8 8 0 1 1 53 40" stroke="#30363d"/>
    <path d="M39 40 A8 8 0 0 1 52 36" stroke="#f0883e"/>
  </g>

  <!-- the FX chain row -->
  <rect x="10" y="47" width="12" height="5" rx="1.5" fill="#1f6feb"/>
  <rect x="26" y="47" width="12" height="5" rx="1.5" fill="#2d333b"/>
  <rect x="42" y="47" width="12" height="5" rx="1.5" fill="#2d333b"/>
</svg>
