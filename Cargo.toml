[workspace]
resolver = "2"
members = ["crates/choz-ports", "crates/choz-engine", "crates/choz-plugin-clap", "crates/choz-plugin-lv2", "crates/choz-plugin-ladspa", "crates/choz-plugin-vst2", "crates/choz-plugin-vst3", "crates/choz-plugin-sandbox", "crates/choz-plugin-pd", "crates/choz-plugin-clap-export", "crates/choz-ui"]

[workspace.package]
version = "1.2.0"
edition = "2021"
description = "A terminal-based audio plugin host — like Carla for the terminal"

[workspace.dependencies]
anyhow = "1"
parking_lot = "0.12"
flume = "0.11"
rtrb = "0.3"
hound = "3"
oxisynth = "0.1"
soundfont = "0.1"
rosc = "0.11"
cpal = { version = "0.15", features = ["jack"] }
# `metadata` is what gates `Port::get_connections`, needed to re-patch our
# playback ports when the user picks a different output.
jack = { version = "0.11", features = ["metadata"] }
midir = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
choz-ports = { path = "crates/choz-ports" }
choz-engine = { path = "crates/choz-engine" }
choz-plugin-clap = { path = "crates/choz-plugin-clap" }
choz-plugin-pd = { path = "crates/choz-plugin-pd" }
choz-plugin-lv2 = { path = "crates/choz-plugin-lv2" }
choz-plugin-ladspa = { path = "crates/choz-plugin-ladspa" }
choz-plugin-vst2 = { path = "crates/choz-plugin-vst2" }
choz-plugin-vst3 = { path = "crates/choz-plugin-vst3" }
choz-plugin-sandbox = { path = "crates/choz-plugin-sandbox" }
choz-plugin-clap-export = { path = "crates/choz-plugin-clap-export" }

# ─── Release profile ──────────────────────────────────────────────────────────
#
# A release build embeds a source path in every panic message, and those paths
# come from the *builder's* home: `strings target/release/choz | grep /home/`
# found 415 of them, mostly `~/.cargo/registry/…`. Whoever builds it should not
# be shipping their directory layout to everyone who installs it.
#
# `strip` drops symbols and debug info — most of that, and a smaller download.
# The panic-location strings survive it, so the release workflow also passes
# `--remap-path-prefix`; `trim-paths`, which would do both from here, is still
# unstable on the toolchain this is built with.
[profile.release]
strip = true
