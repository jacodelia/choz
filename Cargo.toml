[workspace]
resolver = "2"
members = ["crates/choz-ports", "crates/choz-engine", "crates/choz-plugin-clap", "crates/choz-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "A terminal-based audio plugin host — like Carla for the terminal"

[workspace.dependencies]
anyhow = "1"
parking_lot = "0.12"
flume = "0.11"
rtrb = "0.3"
hound = "3"
oxisynth = "0.1"
soundfont = "0.1"
rosc = "0.11"
cpal = { version = "0.15", features = ["jack"] }
jack = "0.11"
midir = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
choz-ports = { path = "crates/choz-ports" }
choz-engine = { path = "crates/choz-engine" }
choz-plugin-clap = { path = "crates/choz-plugin-clap" }
