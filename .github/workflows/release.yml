# ─── choz Release ─────────────────────────────────────────────────────────────
#
# Triggered by pushing a SemVer tag. Builds every artifact and **attaches them
# to the GitHub Release** — modelled on seqterm's workflow, which is where this
# project takes its patterns from.
#
#   git tag -a v1.0.0 -m "Release v1.0.0"
#   git push origin v1.0.0
#
# Artifacts:
#   • choz-<ver>-x86_64-unknown-linux-gnu.tar.gz  + .deb + .rpm
#   • choz-<ver>-aarch64-unknown-linux-gnu.tar.gz + arm64 .deb   (Pi 3/4/5)
#   • choz-<ver>-armv7-unknown-linux-gnueabihf.tar.gz + armhf .deb (Pi 2 / Zero 2 W)
#   • SHA256SUMS.txt
#
# Linux only, and that is not an oversight: choz opens plugin windows through
# the X11 protocol and its audio goes through ALSA/JACK. There is nothing to
# build for Windows or macOS yet.
# ──────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags: ["v*"]
  # A manual dry-run from the Actions tab. No Release is published: there is no
  # tag to attach one to.
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: choz
  # Keep the machine that built the binary out of the binary. A release build
  # embeds a source path in every panic message, and those paths come from the
  # builder's home — 415 of them on a plain build, naming a directory layout
  # that is nobody's business. `strip` does not touch them; these do, and take
  # the count to zero.
  #
  # `trim-paths` would do it from Cargo.toml, and is still unstable.
  RUSTFLAGS: >-
    --remap-path-prefix=/home/runner/.cargo/registry=/cargo/registry
    --remap-path-prefix=/home/runner/.cargo/git=/cargo/git
    --remap-path-prefix=/home/runner/.rustup/toolchains/stable-x86_64-unknown-linux-gnu=/rust
    --remap-path-prefix=/home/runner/work/choz/choz=/build

jobs:
  # ── Linux x86_64: tarball + .deb + .rpm ────────────────────────────────────
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2

      # `libpd-dev` ships `libpd.so`; `puredata-dev` does not — see ci.yml.
      - name: Install Pure Data (libpd)
        run: sudo apt-get update && sudo apt-get install -y libpd-dev

      - name: Build release binary
        run: cargo build --release --locked --bin ${{ env.BIN }}

      # Shipped with choz: its own effects for other hosts, and the child that
      # runs Pure Data patches (the only binary that links libpd).
      - name: Build the CLAP bundle and the Pure Data host
        run: |
          cargo build --release --locked -p choz-plugin-clap-export
          cargo build --release --locked -p choz-plugin-pd --features pd

      - name: Package tarball
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          NAME="${BIN}-${VER}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${NAME}"
          cp "target/release/${BIN}" "dist/${NAME}/"
          strip "dist/${NAME}/${BIN}"
          # The desktop entry, the icon, the launcher and the MIME type: without
          # them the tarball is a binary that never appears in a menu.
          cp README.md LICENSE "dist/${NAME}/"
          cp packaging/install.sh "dist/${NAME}/"
          cp -r packaging/desktop "dist/${NAME}/"
          # The wallpapers a fresh install opens with, choz's own effects as a
          # CLAP plugin, and the Pure Data child. `install.sh` looks for all
          # three beside itself.
          cp -r assets "dist/${NAME}/"
          cp target/release/libchoz_plugin_clap_export.so "dist/${NAME}/"
          strip "dist/${NAME}/libchoz_plugin_clap_export.so"
          cp target/release/choz-pd-host "dist/${NAME}/"
          strip "dist/${NAME}/choz-pd-host"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          rm -rf "dist/${NAME}"

      - name: Build .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb -p choz-ui --no-build --output dist/

      - name: Build .rpm
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm -p crates/choz-ui --output dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-x86_64
          path: dist/*

  # ── Linux ARM (ARM64 + ARMv7 / Raspberry Pi) via cross ─────────────────────
  linux-arm:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-unknown-linux-gnu
          - arch: armhf
            target: armv7-unknown-linux-gnueabihf
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross --locked

      # `cross` builds inside a container carrying the target's own ALSA and
      # JACK headers, which is the whole reason it is used here.
      - name: Build release binary (cross)
        run: cross build --release --locked --target ${{ matrix.target }} --bin ${{ env.BIN }}

      - name: Package tarball
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          NAME="${BIN}-${VER}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/${BIN}" "dist/${NAME}/"
          cp README.md LICENSE "dist/${NAME}/"
          cp packaging/install.sh "dist/${NAME}/"
          cp -r packaging/desktop "dist/${NAME}/"
          # The wallpapers are just files, so they travel on every
          # architecture. The `.clap` and the Pure Data child are native and
          # are built on x86_64 only; `install.sh` skips what is not beside it.
          cp -r assets "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          rm -rf "dist/${NAME}"

      - name: Build .deb
        run: |
          cargo install cargo-deb --locked
          # `--variant arm` carries an explicit `depends`: `$auto` reads the
          # binary's needed libraries by asking the *host* dpkg, and a host that
          # is x86_64 knows nothing about an ARM binary — the package would
          # declare no dependencies at all and install on a Pi with no ALSA.
          #
          # `--no-strip` because the host `strip` cannot process an ARM binary.
          # The `target/release/…` asset path (not `../../target/release/…`) is
          # what makes cargo-deb retarget it: with the other form it packaged
          # the *host* binary into an arm64 package. Verified by unpacking one.
          cargo deb -p choz-ui --variant arm --no-build --no-strip \
            --target ${{ matrix.target }} --output dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  # ── Publish the GitHub Release ─────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [linux, linux-arm]
    runs-on: ubuntu-latest
    # Only on a real tag: a manual dry-run has no release to attach to.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Flatten + checksum
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: choz ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*

  # ── Arch Linux: PKGBUILD for the AUR ───────────────────────────────────────
  #
  # Runs after the release exists, because the checksums are taken from the
  # published tarballs. The PKGBUILD and its .SRCINFO are attached to the same
  # release, so a `choz-bin` package can be built from a tag with no extra
  # infrastructure. Pushing to the AUR is opt-in: it only happens when
  # `AUR_SSH_KEY` is configured.
  arch:
    name: Arch PKGBUILD
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # `makepkg` refuses to run as root, and namcap is only packaged for Arch —
    # so this whole job happens inside the distribution it targets.
    container: archlinux:base-devel
    steps:
      - name: Install tooling
        run: pacman -Sy --noconfirm git namcap

      - uses: actions/checkout@v5

      - name: Download the published tarballs
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Generate PKGBUILD
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist release
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          sh packaging/arch/mkpkgbuild.sh "$VER" dist > release/PKGBUILD
          cat release/PKGBUILD

      - name: Lint and generate .SRCINFO
        shell: bash
        run: |
          # makepkg drops privileges rather than running as root, and the
          # container has none of that set up — one throwaway user is enough.
          useradd -m build
          chown -R build:build "$PWD"
          su build -c 'cd release && makepkg --printsrcinfo > .SRCINFO'
          su build -c 'cd release && namcap PKGBUILD' || true
          cat release/.SRCINFO

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/PKGBUILD
            release/.SRCINFO

      - name: Push to the AUR
        if: ${{ env.AUR_SSH_KEY != '' }}
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur"
          git config --global user.name "choz release bot"
          git config --global user.email "jorgecodelia@gmail.com"
          git clone ssh://aur@aur.archlinux.org/choz-bin.git aur
          cp release/PKGBUILD release/.SRCINFO aur/
          cd aur
          git add PKGBUILD .SRCINFO
          git commit -m "choz-bin ${GITHUB_REF_NAME#v}"
          git push
