name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # libpd comes with `puredata-dev`. It is here because Pure Data support
      # is part of a default install, so the path that links libpd has to be
      # built and tested rather than only compiled on the machine that wrote it.
      - name: Install audio dev libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-dev puredata-dev
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      # The half that only exists with Pure Data installed: the child binary
      # that links libpd, its own tests, and the end-to-end patch test that
      # skips loudly when the child is not built.
      - name: Build and test with Pure Data
        run: |
          cargo build --release -p choz-plugin-pd --features pd
          cargo test -p choz-plugin-pd --features pd
          cargo clippy -p choz-plugin-pd --features pd --all-targets -- -D warnings
          cargo build -p choz-plugin-pd --features pd
          cargo test -p choz-engine --test pd_patch
